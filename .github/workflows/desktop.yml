name: Desktop Build (Tauri)

on:
  push:
    branches:
      - pre
    paths:
      - '.github/workflows/desktop.yml'
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: frontend
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: sunset-desktop-${{ runner.os }}
          path: frontend/src-tauri/target/release/bundle/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete existing desktop beta release
        run: |
          gh release delete desktop-beta --yes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete existing desktop-beta tag
        run: |
          git fetch origin refs/tags/desktop-beta 2>/dev/null && git push origin --delete desktop-beta || true

      - name: Collect MSI installers
        shell: bash
        run: |
          find artifacts -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' | tee bundle-files.txt

      - name: Create Desktop Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-beta
          name: Desktop Beta
          body: |
            ## Desktop Beta

            Automated Tauri build from `${{ github.ref_name }}`.

            - Commit: ${{ github.sha }}
            - Platforms: Windows (.msi), macOS (.dmg), Linux (.AppImage/.deb)

            **Note:** Beta builds may be unstable.
          prerelease: true
          files: bundle-files.txt
