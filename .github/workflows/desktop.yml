name: Desktop Build (Tauri)

on:
  push:
    branches:
      - pre
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # A flaky Linux bundle step must never kill the Windows build.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install

      - name: Build Tauri app
        working-directory: desktop
        run: pnpm tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri bundles its own GStreamer libs but no plugins; the mixed
      # bundled-core/system-plugin combo fails validation and breaks ALL
      # HTML5 video. Strip bundled libgst* so the AppImage uses the
      # host's full GStreamer (core + plugins + scanner) instead.
      - name: Strip bundled GStreamer libs, repack AppImage (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri/target/release/bundle/appimage
        run: |
          rm -f SunSet.AppDir/usr/lib/libgst*
          curl -sL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool SunSet.AppDir SunSet_0.2.0_amd64.AppImage

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: sunset-desktop-${{ runner.os }}
          path: desktop/src-tauri/target/release/bundle/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete existing desktop beta release
        run: |
          gh release delete desktop-beta --yes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete existing desktop-beta tag
        run: |
          git fetch origin refs/tags/desktop-beta 2>/dev/null && git push origin --delete desktop-beta || true

      - name: Create Desktop Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-beta
          name: Desktop Beta
          body: |
            ## Desktop Beta

            Automated Tauri build from `${{ github.ref_name }}`.

            - Commit: ${{ github.sha }}
            - Platforms: Windows (.msi), Linux (.AppImage/.deb)

            **Note:** Beta builds may be unstable.
          prerelease: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/**/*.deb
