name: Desktop Build (Tauri)

on:
  push:
    branches:
      - pre
    paths:
      - '.github/workflows/desktop.yml'
      - 'desktop/**'
  workflow_dispatch:

jobs:
  build:
    strategy:
      # A flaky Linux bundle step must never kill the Windows build.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri"

      # Tauri's Linux bundler downloads AppRun + linuxdeploy from
      # tauri-apps/binary-releases at bundle time. That endpoint flakes
      # with `http status: 500` and kills the whole build even though
      # deb/rpm already succeeded. Cache + pre-warm them so a retry
      # usually doesn't need the network at all.
      - name: Cache Tauri bundler tools (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-bundler-${{ runner.os }}-v1
          restore-keys: |
            tauri-bundler-${{ runner.os }}-

      - name: Pre-download Tauri Linux bundler tools (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/.cache/tauri
          set -x
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o ~/.cache/tauri/AppRun-x86_64 \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
          cp ~/.cache/tauri/linuxdeploy-x86_64.AppImage ~/.cache/tauri/linuxdeploy-07333c6-x86_64.AppImage || true
          chmod +x ~/.cache/tauri/AppRun-x86_64 ~/.cache/tauri/linuxdeploy-x86_64.AppImage || true
          ls -la ~/.cache/tauri

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        working-directory: desktop
        run: pnpm install

      - name: Build Tauri app
        working-directory: desktop
        run: |
          # The AppImage bundling step downloads external binaries and
          # transiently fails with `http status: 500`. deb/rpm already
          # succeed before that point, and rust-cache makes a retry cheap,
          # so retry the whole build up to 3 times.
          for i in 1 2 3; do
            echo "Build attempt $i..."
            if pnpm tauri:build; then
              echo "Build succeeded on attempt $i"
              break
            fi
            echo "Build attempt $i failed"
            if [ "$i" -eq 3 ]; then
              echo "All build attempts failed"
              exit 1
            fi
            sleep 15
          done
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri bundles its own GStreamer libs but no plugins; the mixed
      # bundled-core/system-plugin combo fails validation and breaks ALL
      # HTML5 video. Strip bundled libgst* so the AppImage uses the
      # host's full GStreamer (core + plugins + scanner) instead.
      - name: Strip bundled GStreamer libs, repack AppImage (Linux)
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri/target/release/bundle/appimage
        run: |
          rm -f SunSet.AppDir/usr/lib/libgst*
          # `continuous` tag for appimagetool flakes the same way as the
          # Tauri binaries above. Prefer a versioned release, fall back
          # to continuous, all with retries.
          if ! curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
            -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/13/appimagetool-x86_64.AppImage; then
            curl -fSL --retry 5 --retry-all-errors --retry-delay 5 \
              -o /tmp/appimagetool \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          fi
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool SunSet.AppDir SunSet_0.2.0_amd64.AppImage

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: sunset-desktop-${{ runner.os }}
          path: desktop/src-tauri/target/release/bundle/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete existing desktop beta release
        run: |
          gh release delete desktop-beta --yes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delete existing desktop-beta tag
        run: |
          git fetch origin refs/tags/desktop-beta 2>/dev/null && git push origin --delete desktop-beta || true

      - name: Create Desktop Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-beta
          name: Desktop Beta
          body: |
            ## Desktop Beta

            Automated Tauri build from `${{ github.ref_name }}`.

            - Commit: ${{ github.sha }}
            - Platforms: Windows (.msi), Linux (.AppImage/.deb)

            **Note:** Beta builds may be unstable.
          prerelease: true
          files: |
            artifacts/**/*.msi
            artifacts/**/*.msi.sig
            artifacts/**/*.AppImage
            artifacts/**/*.AppImage.sig
            artifacts/**/*.deb
